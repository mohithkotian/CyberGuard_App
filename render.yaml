services:
  - type: web
    name: cybercrime-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: https://cybercrime-ml-service.onrender.com
      - key: ADMIN_EMAIL
        value: admin@cybercrime.gov
      - key: ADMIN_PASSWORD
        value: Admin@123456

  - type: web
    name: cybercrime-ml-service
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt_tab'); nltk.download('stopwords'); nltk.download('wordnet')" && python train_model.py
    startCommand: python src/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
