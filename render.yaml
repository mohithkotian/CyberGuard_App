services:
  # ─────────────────────────────────────────────────────────
  # BACKEND API (Express + Node.js)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: cybercrime-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_URI_FALLBACK
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://cybercrime-web-buzn.onrender.com,https://cybercrime-web.onrender.com,http://localhost:3000
      - key: ML_SERVICE_URL
        value: https://cybercrime-ml-service-buzn.onrender.com
      - key: ADMIN_EMAIL
        value: admin@cybercrime.gov
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_INTERNAL_SECRET
        generateValue: true

  # ─────────────────────────────────────────────────────────
  # ML SERVICE (Python Flask + Gunicorn)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: cybercrime-ml-service
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: gunicorn -w 1 --threads 2 -b 0.0.0.0:$PORT src.app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: ML_ALLOWED_ORIGINS
        sync: false
      - key: ML_INTERNAL_SECRET
        fromService:
          type: web
          name: cybercrime-backend
          envVarKey: ML_INTERNAL_SECRET

  # ─────────────────────────────────────────────────────────
  # FRONTEND WEB APP (React SPA)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: cybercrime-web
    env: static
    rootDir: web-app
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        value: https://cybercrime-backend-buzn.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://cybercrime-backend-buzn.onrender.com
      - key: GENERATE_SOURCEMAP
        value: "false"
